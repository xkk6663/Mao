<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小智快速对话</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --accent:#4f6ef7; --muted:#8a919c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--fg);
    background:rgba(255,255,255,0.985);
    display:flex; flex-direction:column;
    overflow:hidden; border-radius:14px;
  }
  .titlebar {
    -webkit-app-region:drag;
    display:flex; align-items:center; gap:8px;
    padding:8px 12px; background:linear-gradient(90deg,#4f6ef7,#7a5cf0);
    color:#fff; border-radius:14px 14px 0 0; user-select:none;
    flex:none;
  }
  .titlebar .dot { width:9px; height:9px; border-radius:50%; background:#7ef0a6; box-shadow:0 0 6px #7ef0a6; }
  .titlebar .dot.connecting { background:#f5c26b; box-shadow:0 0 6px #f5c26b; }
  .titlebar .dot.offline { background:#f0785e; box-shadow:0 0 6px #f0785e; }
  .titlebar .title { font-size:13px; font-weight:600; flex:1; letter-spacing:1px; }
  .titlebar .hist {
    -webkit-app-region:no-drag; cursor:pointer;
    height:24px; padding:0 10px; border-radius:7px; background:rgba(255,255,255,0.16);
    color:#fff; border:none; font-size:11px; display:flex; align-items:center; gap:4px;
  }
  .titlebar .hist:hover { background:rgba(255,255,255,0.32); }
  .titlebar .close {
    -webkit-app-region:no-drag; cursor:pointer;
    width:24px; height:24px; border-radius:7px; background:rgba(255,255,255,0.16);
    color:#fff; border:none; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .titlebar .close:hover { background:rgba(255,255,255,0.32); }
  .statusline {
    flex:none; min-height:0; padding:3px 12px 0;
    font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .statusline.thinking { color:var(--accent); }
  .statusline .spin { width:12px; height:12px; border:2px solid #d6d9e0; border-top-color:var(--accent); border-radius:50%; animation:rot 0.9s linear infinite; flex:none; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .pending { display:none; flex-wrap:wrap; gap:6px; padding:4px 12px 0; flex:none; }
  .pending .item { position:relative; width:46px; height:46px; border-radius:8px; overflow:hidden; border:1px solid #dcdfe4; flex:none; }
  .pending .item img { width:100%; height:100%; object-fit:cover; display:block; }
  .pending .item button { position:absolute; top:1px; right:1px; width:15px; height:15px; border-radius:50%; border:none; background:rgba(0,0,0,0.55); color:#fff; font-size:9px; line-height:15px; cursor:pointer; padding:0; }
  .inputbar { display:flex; gap:8px; padding:8px 12px 10px; border-top:1px solid #e8eaee; flex:none; }
  .inputbar .imgbtn {
    border:1px solid #dcdfe4; border-radius:10px; background:#fff; color:var(--muted);
    font-size:15px; cursor:pointer; width:38px; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .inputbar .imgbtn:hover { border-color:var(--accent); color:var(--accent); }
  .inputbar input {
    flex:1; border:1px solid #dcdfe4; border-radius:10px; padding:8px 12px; font-size:14px; outline:none; background:#fff; min-width:0;
  }
  .inputbar input:focus { border-color:var(--accent); }
  .inputbar button {
    border:none; border-radius:10px; padding:0 16px; background:var(--accent); color:#fff; font-size:13px; cursor:pointer; flex:none;
  }
  .inputbar button:disabled { opacity:0.45; cursor:default; }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="dot offline" id="statusDot"></span>
    <span class="title">小智快速对话</span>
    <button class="hist" id="histBtn" title="查看完整聊天记录（打开主聊天界面）">历史记录</button>
    <button class="close" id="closeBtn" title="关闭">&#10005;</button>
  </div>
  <div class="statusline" id="statusLine"></div>
  <div class="pending" id="pendingBar"></div>
  <div class="inputbar">
    <button class="imgbtn" id="imgBtn" title="选择图片（暂存，点发送才发）">&#128247;</button>
    <input id="input" type="text" placeholder="给小智发消息，回车发送…" autocomplete="off">
    <button id="sendBtn">发送</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>
<script src="xiaozhi-chat.js"></script>
</body>
</html>
