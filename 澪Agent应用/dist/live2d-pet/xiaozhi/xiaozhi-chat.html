<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小智对话</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --accent:#4f6ef7; --muted:#8a919c; --bubble-u:#4f6ef7; --bubble-a:#f2f3f5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--fg);
    background:rgba(255,255,255,0.985);
    display:flex; flex-direction:column;
    overflow:hidden; border-radius:14px;
  }
  .titlebar {
    -webkit-app-region:drag;
    display:flex; align-items:center; gap:8px;
    padding:10px 14px; background:linear-gradient(90deg,#4f6ef7,#7a5cf0);
    color:#fff; border-radius:14px 14px 0 0; user-select:none;
  }
  .titlebar .dot { width:9px; height:9px; border-radius:50%; background:#7ef0a6; box-shadow:0 0 6px #7ef0a6; }
  .titlebar .dot.connecting { background:#f5c26b; box-shadow:0 0 6px #f5c26b; }
  .titlebar .dot.offline { background:#f0785e; box-shadow:0 0 6px #f0785e; }
  .titlebar .title { font-size:14px; font-weight:600; flex:1; letter-spacing:1px; }
  .titlebar .close {
    -webkit-app-region:no-drag; cursor:pointer;
    width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,0.16);
    color:#fff; border:none; font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .titlebar .close:hover { background:rgba(255,255,255,0.32); }
  .msgs { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:9px 12px; border-radius:12px; font-size:14px; line-height:1.5; word-break:break-word; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--bubble-u); color:#fff; border-bottom-right-radius:4px; }
  .msg.ai { align-self:flex-start; background:var(--bubble-a); color:var(--fg); border-bottom-left-radius:4px; }
  .msg.sys { align-self:center; background:transparent; color:var(--muted); font-size:12px; padding:2px 8px; }
  .msg .meta { display:block; font-size:11px; color:var(--muted); margin-bottom:2px; }
  .msg.user .meta { color:rgba(255,255,255,0.75); }
  .msg.img { padding:6px; max-width:70%; }
  .msg.img.user { align-self:flex-end; background:var(--bubble-u); }
  .msg.img img { display:block; max-width:220px; max-height:160px; border-radius:8px; background:#fff; }
  .msg.img .cap { display:block; font-size:12px; margin-top:4px; color:var(--muted); }
  .msg.img.user .cap { color:rgba(255,255,255,0.8); }
  .thinking { align-self:flex-start; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; padding:4px 0; }
  .thinking .spin { width:14px; height:14px; border:2px solid #d6d9e0; border-top-color:var(--accent); border-radius:50%; animation:rot 0.9s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .speaking { align-self:flex-start; display:flex; align-items:center; gap:6px; color:var(--accent); font-size:12px; padding:2px 0; }
  .speaking .bar { width:4px; height:12px; background:var(--accent); border-radius:2px; animation:wave 0.8s ease-in-out infinite; }
  .speaking .bar:nth-child(2) { animation-delay:0.15s; }
  .speaking .bar:nth-child(3) { animation-delay:0.3s; }
  @keyframes wave { 0%,100% { transform:scaleY(0.4); } 50% { transform:scaleY(1); } }
  .inputbar { display:flex; gap:8px; padding:10px 12px 12px; border-top:1px solid #e8eaee; }
  .inputbar .imgbtn {
    border:1px solid #dcdfe4; border-radius:10px; background:#fff; color:var(--muted);
    font-size:16px; cursor:pointer; width:38px; display:flex; align-items:center; justify-content:center;
  }
  .inputbar .imgbtn:hover { border-color:var(--accent); color:var(--accent); }
  .inputbar input {
    flex:1; border:1px solid #dcdfe4; border-radius:10px; padding:9px 12px; font-size:14px; outline:none; background:#fff;
  }
  .inputbar input:focus { border-color:var(--accent); }
  .inputbar button {
    border:none; border-radius:10px; padding:0 18px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer;
  }
  .inputbar button:disabled { opacity:0.45; cursor:default; }
  .hint { font-size:11px; color:var(--muted); text-align:center; padding:0 12px 8px; }
  .pending { display:none; flex-wrap:wrap; gap:6px; padding:6px 12px; }
  .pending .item { position:relative; width:52px; height:52px; border-radius:8px; overflow:hidden; border:1px solid #dcdfe4; flex:none; }
  .pending .item img { width:100%; height:100%; object-fit:cover; display:block; }
  .pending .item button { position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%; border:none; background:rgba(0,0,0,0.55); color:#fff; font-size:10px; line-height:16px; cursor:pointer; padding:0; }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="dot offline" id="statusDot"></span>
    <span class="title">小智对话</span>
    <button class="close" id="closeBtn" title="关闭">&#10005;</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="hint">接入小智官方控制台（免费）· 文字/图片对话 · 图片先暂存，点发送才发 · 会话历史实时同步</div>
  <div class="pending" id="pendingBar"></div>
  <div class="inputbar">
    <button class="imgbtn" id="imgBtn" title="选择图片（暂存，点发送才发）">&#128247;</button>
    <input id="input" type="text" placeholder="输入消息，回车发送…" autocomplete="off">
    <button id="sendBtn">发送</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>
<script src="xiaozhi-chat.js"></script>
</body>
</html>
