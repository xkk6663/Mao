<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mio 桌宠管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:#0f1117; color:#e8eaf0; padding:18px; min-height:100vh;
  }
  h1 { font-size:18px; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  h1 .dot { width:9px; height:9px; border-radius:50%; background:#5ee08a; box-shadow:0 0 8px #5ee08a; }
  .grid { display:flex; flex-direction:column; gap:12px; }
  .card {
    background:#171b26; border:1px solid rgba(255,255,255,0.08);
    border-radius:12px; padding:14px 16px;
  }
  .card h2 { font-size:14px; color:#9aa3b5; font-weight:600; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:13px; border-bottom:1px dashed rgba(255,255,255,0.05); }
  .row:last-child { border-bottom:none; }
  .row .k { color:#8a93a6; }
  .row .v { color:#e8eaf0; font-weight:500; }
  .ok { color:#5ee08a; } .warn { color:#f5c26b; } .bad { color:#f0785e; }
  .dev { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,0.05); font-size:13px; }
  .dev:last-child { border-bottom:none; }
  .dev .tag { font-size:11px; padding:1px 7px; border-radius:8px; background:rgba(94,224,138,0.15); color:#5ee08a; }
  .dev .vol { margin-left:auto; color:#8a93a6; }
  .btn {
    border:none; cursor:pointer; border-radius:10px; padding:9px 16px;
    font-size:13px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,#4f6ef7,#7a5cf0);
    transition:opacity 0.15s;
  }
  .btn:hover { opacity:0.88; }
  .btn.alt { background:rgba(255,255,255,0.12); }
  .btn:disabled { opacity:0.4; cursor:default; }
  .toolbar { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .note { font-size:12px; color:#6d7688; margin-top:8px; line-height:1.7; }
  .banner { font-size:12px; padding:8px 12px; border-radius:8px; margin-bottom:10px; }
  .banner.warn { background:rgba(245,194,107,0.12); color:#f5c26b; border:1px solid rgba(245,194,107,0.25); }
  .banner.ok { background:rgba(94,224,138,0.1); color:#5ee08a; border:1px solid rgba(94,224,138,0.25); }
  #micResult { font-size:12px; color:#8a93a6; margin-top:6px; }
  .model-item { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,0.05); font-size:13px; }
  .model-item:last-child { border-bottom:none; }
  .model-item .cur { font-size:11px; padding:1px 7px; border-radius:8px; background:rgba(94,224,138,0.15); color:#5ee08a; }
  .model-item .mname { color:#e8eaf0; }
  .model-item .mid { color:#6d7688; font-size:11px; }
  .model-item .btn { margin-left:auto; padding:5px 12px; font-size:12px; }
  .sched-row { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; }
  .sched-row .k { color:#8a93a6; }
  .sched-row select, .sched-row input[type=time] {
    background:#0f1117; color:#e8eaf0; border:1px solid rgba(255,255,255,0.15);
    border-radius:8px; padding:5px 8px; font-size:13px;
  }
  .switch { position:relative; width:40px; height:22px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch .slider {
    position:absolute; inset:0; border-radius:11px; background:rgba(255,255,255,0.15);
    transition:0.2s; cursor:pointer;
  }
  .switch .slider:before {
    content:''; position:absolute; width:16px; height:16px; border-radius:50%;
    left:3px; top:3px; background:#fff; transition:0.2s;
  }
  .switch input:checked + .slider { background:#4f6ef7; }
  .switch input:checked + .slider:before { transform:translateX(18px); }
  #visionResult { font-size:12px; color:#8a93a6; margin-top:8px; line-height:1.7; max-height:180px; overflow:auto; white-space:pre-wrap; }
  #modelResult { font-size:12px; color:#8a93a6; margin-top:6px; }
</style>
</head>
<body>
  <h1><span class="dot" id="petDot"></span> Mio 桌宠管理</h1>

  <div class="toolbar">
    <button class="btn" onclick="refreshAll()">🔄 刷新</button>
    <button class="btn alt" onclick="playWebTone()">🔊 桌宠测试音 (880Hz)</button>
    <button class="btn alt" onclick="playSystemTone()">🎵 系统测试音 (440Hz)</button>
    <button class="btn alt" onclick="testMic()">🎤 麦克风检测</button>
  </div>

  <div id="audioBanner"></div>

  <div class="grid">
    <div class="card">
      <h2>桌宠状态</h2>
      <div id="petRows">加载中…</div>
    </div>
    <div class="card">
      <h2>Live2D 模型管理</h2>
      <div id="modelRows">加载中…</div>
      <p class="note">点模型旁的「切换」立即换装；「自动更换」开启后每天到点自动换一个模型。</p>
      <div id="modelResult"></div>
    </div>
    <div class="card">
      <h2>屏幕观察 · 小智视觉</h2>
      <div class="toolbar" style="margin-bottom:6px">
        <button class="btn" onclick="shotAndAnalyze()">📷 截屏让小智分析</button>
      </div>
      <div id="visionResult">点按钮截取当前屏幕，由小智官方云视觉（免费）分析内容。</div>
      <p class="note">需要小智对话已连接（视觉能力来自小智云端）。</p>
    </div>
    <div class="card">
      <h2>版本信息</h2>
      <div id="verRows">加载中…</div>
    </div>
    <div class="card">
      <h2>小智对话连接</h2>
      <div id="xiaozhiRows">加载中…</div>
    </div>
    <div class="card">
      <h2>音频体检 · 输出设备</h2>
      <div id="devList">加载中…</div>
      <p class="note">⚠ 如果默认设备音量很低（低于 30%），桌宠语音会几乎听不见——请把 Windows 音量合成器里的音量调大，或在系统设置里切换默认输出设备。</p>
      <div id="micResult"></div>
    </div>
  </div>

<script>
(function () {
  'use strict'
  const $ = (id) => document.getElementById(id)

  async function get(url) {
    const r = await fetch(url, { cache: 'no-store' })
    if (!r.ok) throw new Error(url + ' -> ' + r.status)
    return r.json()
  }

  function esc(s) {
    return String(s == null ? '-' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }

  function row(k, v, cls) {
    return '<div class="row"><span class="k">' + esc(k) + '</span><span class="v ' + (cls || '') + '">' + esc(v) + '</span></div>'
  }

  async function refreshPet() {
    try {
      const s = await get('/api/companion/status')
      const pet = s.pet || {}
      const l2d = (s.live2d && s.live2d.runtime) || {}
      const settings = pet.settings || {}
      const html =
        row('运行状态', pet.running ? '运行中' : '未运行', pet.running ? 'ok' : 'bad') +
        row('模型', (l2d.model_name || '-') + ' (' + (l2d.model_id || '-') + ')') +
        row('尺寸', (settings.pet_size_percent || 100) + '%') +
        row('位置 (X,Y)', (settings.position_x || 0) + ', ' + (settings.position_y || 0)) +
        row('置顶', settings.live2d_always_on_top ? '是' : '否', settings.live2d_always_on_top ? 'ok' : '') +
        row('说话气泡', settings.live2d_speech_bubble_enabled ? '开' : '关') +
        row('当前活动', (pet.activity && pet.activity.label) || '-') +
        row('渲染器', (l2d.runtime || '-') + (l2d.connected ? '' : '（断开）'), l2d.connected ? 'ok' : 'bad')
      $('petRows').innerHTML = html
      $('petDot').style.background = pet.running ? '#5ee08a' : '#f0785e'
      $('petDot').style.boxShadow = pet.running ? '0 0 8px #5ee08a' : '0 0 8px #f0785e'
    } catch (e) {
      $('petRows').innerHTML = '<span class="bad">读取失败：' + esc(e.message) + '</span>'
    }
  }

  async function refreshXiaozhi() {
    try {
      const s = await get('/api/xiaozhi/status')
      const html =
        row('上游连接', s.connected ? '已连接' : '断开', s.connected ? 'ok' : 'bad') +
        row('会话 ID', s.session_id || '-') +
        row('设备 MAC', s.mac || '-') +
        row('订阅者(横条窗)', s.subscribers || 0)
      $('xiaozhiRows').innerHTML = html
    } catch (e) {
      $('xiaozhiRows').innerHTML = '<span class="bad">读取失败：' + esc(e.message) + '</span>'
    }
  }

  async function refreshAudio() {
    try {
      const s = await get('/api/companion/audio/devices')
      if (!s.ok) { $('devList').innerHTML = '<span class="bad">枚举失败：' + esc(s.error) + '</span>'; return }
      const defaultName = s.default ? s.default.name : ''
      let html = ''
      for (const d of s.devices) {
        const isDef = d.is_default ? ' <span class="tag">默认</span>' : ''
        const vol = d.volume == null ? '?' : d.volume + '%'
        const volCls = d.volume != null && d.volume < 30 ? 'warn' : ''
        const mute = d.muted ? ' <span class="bad">已静音</span>' : ''
        html += '<div class="dev">' + esc(d.name) + isDef + mute +
                '<span class="vol ' + volCls + '">音量 ' + vol + '</span></div>'
      }
      $('devList').innerHTML = html || '<span class="bad">未发现输出设备</span>'

      // 体检结论
      let banner = ''
      const def = s.devices.find(function (d) { return d.is_default })
      if (!def) banner = '<div class="banner warn">⚠ 未识别到默认输出设备</div>'
      else if (def.muted) banner = '<div class="banner warn">⚠ 默认设备「' + esc(def.name) + '」处于静音状态</div>'
      else if (def.volume != null && def.volume < 30) banner = '<div class="banner warn">⚠ 默认设备「' + esc(def.name) + '」音量仅 ' + def.volume + '%，几乎听不见，建议调大</div>'
      else banner = '<div class="banner ok">✓ 默认设备「' + esc(def.name) + '」音量 ' + (def.volume != null ? def.volume + '%' : '?') + '，正常</div>'
      $('audioBanner').innerHTML = banner
    } catch (e) {
      $('devList').innerHTML = '<span class="bad">读取失败：' + esc(e.message) + '</span>'
    }
  }

  function playWebTone() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)()
      const osc = ctx.createOscillator(); osc.frequency.value = 880
      const g = ctx.createGain(); g.gain.value = 0.4
      osc.connect(g); g.connect(ctx.destination)
      osc.start()
      setTimeout(function () { try { osc.stop() } catch (e) {} }, 1500)
    } catch (e) { alert('播放失败：' + e.message) }
  }

  async function playSystemTone() {
    try {
      await fetch('/api/companion/audio/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ freq: 440, seconds: 1.2 }),
      })
    } catch (e) { alert('请求失败：' + e.message) }
  }

  async function testMic() {
    const el = $('micResult')
    el.textContent = '请求麦克风权限…'
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
      const track = stream.getAudioTracks()[0]
      const settings = track.getSettings ? track.getSettings() : {}
      const stopTracks = stream.getTracks()
      setTimeout(function () { stopTracks.forEach(function (t) { t.stop() }) }, 1500)
      el.innerHTML = '<span class="ok">✓ 麦克风可用：' + esc(track.label || '默认麦克风') +
                     (settings.sampleRate ? '，采样率 ' + settings.sampleRate : '') + '</span>'
    } catch (e) {
      el.innerHTML = '<span class="bad">✗ 麦克风不可用：' + esc(e.message) + '</span>'
    }
  }

  let _modelList = []
  let _scheduleData = null

  async function refreshModels() {
    try {
      const m = await get('/api/companion/live2d/models')
      let sched = null
      try { sched = await get('/api/companion/live2d/schedule') } catch (e) {}
      _modelList = (m.models || []).map(function (md) { return { id: md.id, name: md.display_name || md.name || md.id } })
      _scheduleData = sched
      let current = '-'
      try {
        const st = await get('/api/companion/status')
        current = ((st.live2d && st.live2d.runtime) || {}).model_id || '-'
      } catch (e) {}
      let html = ''
      for (const md of _modelList) {
        const isCur = String(md.id) === String(current)
        html += '<div class="model-item"><span class="mname">' + esc(md.name) + '</span>' +
                '<span class="mid">' + esc(md.id) + '</span>' +
                (isCur ? '<span class="cur">当前</span>' : '') +
                (isCur ? '' : '<button class="btn" onclick="switchModel(\'' + esc(md.id).replace(/'/g, "\\'") + '\')">切换</button>') +
                '</div>'
      }
      html += '<div class="sched-row"><span class="k">自动更换</span>' +
        '<label class="switch"><input type="checkbox" id="schedEnabled" ' + ((sched && sched.enabled) ? 'checked' : '') +
        ' onchange="saveSchedule()"><span class="slider"></span></label>' +
        '<span class="k">时间</span><input type="time" id="schedTime" value="' + esc((sched && sched.time) || '09:00') + '" onchange="saveSchedule()">' +
        '<span class="k">模式</span><select id="schedMode" onchange="saveSchedule()">' +
        '<option value="random"' + ((sched && sched.mode === 'random') ? ' selected' : '') + '>随机</option>' +
        '<option value="sequential"' + ((sched && sched.mode === 'sequential') ? ' selected' : '') + '>顺序</option>' +
        '</select></div>' +
        '<div class="sched-row"><span class="k">上次更换</span><span class="v">' + esc((sched && sched.last_switched) || '尚未更换') + '</span></div>'
      $('modelRows').innerHTML = html
    } catch (e) {
      $('modelRows').innerHTML = '<span class="bad">读取失败：' + esc(e.message) + '</span>'
    }
  }

  window.switchModel = async function (modelId) {
    const el = $('modelResult')
    el.innerHTML = '正在切换…'
    try {
      const r = await fetch('/api/companion/status', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ live2d_model_id: modelId }) })
      if (!r.ok) throw new Error('PATCH status -> ' + r.status)
      el.innerHTML = '<span class="ok">✓ 已切换，桌宠正在换装</span>'
      setTimeout(refreshModels, 2500)
    } catch (e) {
      el.innerHTML = '<span class="bad">✗ 切换失败：' + esc(e.message) + '</span>'
    }
  }

  window.saveSchedule = async function () {
    const el = $('modelResult')
    try {
      const body = {
        enabled: $('schedEnabled').checked,
        time: $('schedTime').value || '09:00',
        mode: $('schedMode').value,
      }
      const r = await fetch('/api/companion/live2d/schedule', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      })
      if (!r.ok) throw new Error('PATCH schedule -> ' + r.status)
      el.innerHTML = '<span class="ok">✓ 已保存（' + (body.enabled ? '每天 ' + body.time + ' 自动换' : '已关闭') + '）</span>'
      setTimeout(refreshModels, 1200)
    } catch (e) {
      el.innerHTML = '<span class="bad">✗ 保存失败：' + esc(e.message) + '</span>'
    }
  }

  window.shotAndAnalyze = async function () {
    const el = $('visionResult')
    el.textContent = '截屏中…'
    try {
      const shot = await fetch('/api/companion/screen-shot', { method: 'POST', cache: 'no-store' })
      if (!shot.ok) throw new Error('截图失败 -> ' + shot.status)
      const sj = await shot.json()
      if (!sj.ok || !sj.image_base64) throw new Error(sj.error || '截图无数据')
      el.textContent = '截屏完成，正在调用小智视觉分析…'
      const vr = await fetch('/api/xiaozhi/vision', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_base64: sj.image_base64, question: '请详细描述这张屏幕截图里的内容，包括窗口、文字和界面元素。' }),
      })
      if (!vr.ok) {
        let msg = 'HTTP ' + vr.status
        try { const ej = await vr.json(); msg = ej.detail || msg } catch (e2) {}
        throw new Error(msg)
      }
      const vj = await vr.json()
      if (!vj.ok) throw new Error(vj.detail || '分析失败')
      el.textContent = '✓ 小智视觉分析结果：\n' + (vj.text || '（无描述）')
    } catch (e) {
      el.innerHTML = '<span class="bad">✗ ' + esc(e.message) + '</span>'
    }
  }

  async function refreshVersion() {
    let info = {}
    try {
      if (window.mioDesktop && window.mioDesktop.getVersion) {
        info = (await window.mioDesktop.getVersion()) || {}
      }
    } catch (e) { info = { err: String(e.message || e) } }
    let backend = {}
    try { backend = (await get('/api/companion/version')).data || {} } catch (e) {}
    const html =
      row('应用', info.app || 'Mio Live2D 桌宠') +
      row('前端 (live2d-pet.js)', info.frontend || (info.err ? '未知' : '-')) +
      row('Electron', info.electron || '-') +
      row('Chromium', info.chrome || '-') +
      row('Node.js', info.node || '-') +
      row('构建日期', info.build || '-') +
      row('后端服务', backend.name || '-') +
      row('后端 Python', backend.python || '-') +
      row('音频解码 (PyAV)', backend.av || '-')
    $('verRows').innerHTML = html
  }

  window.refreshAll = function () { refreshPet(); refreshModels(); refreshXiaozhi(); refreshAudio(); refreshVersion() }
  window.playWebTone = playWebTone
  window.playSystemTone = playSystemTone
  window.testMic = testMic

  refreshAll()
  setInterval(refreshAll, 6000)
})()
</script>
</body>
</html>
