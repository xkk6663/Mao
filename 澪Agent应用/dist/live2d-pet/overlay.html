<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>选择屏幕区域</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent; cursor:crosshair; font-family:"Microsoft YaHei",system-ui,sans-serif; }
  #stage { position:fixed; inset:0; }
  #shot { position:absolute; display:block; box-shadow:0 0 0 2000px rgba(0,0,0,0.55); }
  #sel { position:absolute; border:2px solid #4f6ef7; background:rgba(79,110,247,0.18); display:none; z-index:2; }
  #sel::after { content:''; position:absolute; inset:0; outline:1px dashed rgba(255,255,255,0.6); }
  #bar {
    position:fixed; left:50%; bottom:36px; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center; z-index:3;
    background:rgba(15,17,23,0.92); border:1px solid rgba(255,255,255,0.15);
    border-radius:12px; padding:10px 16px; color:#e8eaf0; font-size:13px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  #bar b { font-weight:600; }
  #bar .dim { color:#8a93a6; font-size:12px; }
  button {
    border:none; cursor:pointer; border-radius:8px; padding:7px 14px;
    font-size:13px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,#4f6ef7,#7a5cf0);
  }
  button.alt { background:rgba(255,255,255,0.14); }
  button:disabled { opacity:0.4; cursor:default; }
  #tip { position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:3;
    background:rgba(15,17,23,0.85); color:#e8eaf0; border:1px solid rgba(255,255,255,0.12);
    border-radius:10px; padding:8px 16px; font-size:12px; }
</style>
</head>
<body>
  <div id="tip">拖拽框选要分析的屏幕区域 · Enter 确定 · Esc 取消</div>
  <div id="stage"><img id="shot" alt=""></div>
  <div id="sel"></div>
  <div id="bar">
    <b id="size">0 × 0</b>
    <span class="dim">px</span>
    <button id="ok" disabled>分析这片区域</button>
    <button id="cancel" class="alt">取消 (Esc)</button>
  </div>

<script>
(function () {
  'use strict'
  const $ = (id) => document.getElementById(id)
  const shot = $('shot'), sel = $('sel')
  const okBtn = $('ok'), sizeEl = $('size')
  let imgW = 0, imgH = 0, virtW = 0, virtH = 0
  let drawW = 0, drawH = 0, offX = 0, offY = 0
  let sx = 0, sy = 0, dragging = false, rect = null

  async function apiGet(url, method, body, timeoutMs) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null
    const timer = ctrl ? setTimeout(() => { try { ctrl.abort() } catch (e) {} }, timeoutMs || 60000) : null
    try {
      const r = await fetch(url, {
        method: method || 'GET',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined,
        cache: 'no-store',
        signal: ctrl ? ctrl.signal : undefined,
      })
      if (!r.ok) throw new Error('HTTP ' + r.status)
      return r.json()
    } finally { if (timer) clearTimeout(timer) }
  }

  function place() {
    const vw = window.innerWidth, vh = window.innerHeight
    const scale = Math.min(vw / imgW, vh / imgH)
    drawW = Math.round(imgW * scale); drawH = Math.round(imgH * scale)
    offX = Math.round((vw - drawW) / 2); offY = Math.round((vh - drawH) / 2)
    shot.style.left = offX + 'px'; shot.style.top = offY + 'px'
    shot.style.width = drawW + 'px'; shot.style.height = drawH + 'px'
  }

  function toVirt(clientX, clientY) {
    const x = (clientX - offX) * (virtW / drawW)
    const y = (clientY - offY) * (virtH / drawH)
    return [Math.round(x), Math.round(y)]
  }

  function updateSel() {
    const x1 = Math.min(sx, rect.cx), y1 = Math.min(sy, rect.cy)
    const w = Math.abs(rect.cx - sx), h = Math.abs(rect.cy - sy)
    sel.style.left = x1 + 'px'; sel.style.top = y1 + 'px'
    sel.style.width = w + 'px'; sel.style.height = h + 'px'
    const v = toVirt(x1, y1), v2 = toVirt(x1 + w, y1 + h)
    rect.bbox = [v[0], v[1], Math.max(1, v2[0] - v[0]), Math.max(1, v2[1] - v[1])]
    sizeEl.textContent = rect.bbox[2] + ' × ' + rect.bbox[3]
  }

  window.addEventListener('pointerdown', (e) => {
    if (e.target === shot || e.target === sel) {
      dragging = true
      const p = toVirt(e.clientX, e.clientY)
      sx = e.clientX; sy = e.clientY
      rect = { cx: e.clientX, cy: e.clientY, bbox: null }
      sel.style.display = 'block'
      okBtn.disabled = true
    }
  })
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return
    rect.cx = e.clientX; rect.cy = e.clientY
    updateSel()
  })
  window.addEventListener('pointerup', () => {
    if (!dragging) return
    dragging = false
    if (rect && rect.bbox && rect.bbox[2] >= 8 && rect.bbox[3] >= 8) okBtn.disabled = false
    else { sel.style.display = 'none'; rect = null }
  })
  window.addEventListener('keydown', async (e) => {
    if (e.key === 'Escape') { window.close(); return }
    if (e.key === 'Enter' && rect && rect.bbox && !okBtn.disabled) { await run(rect.bbox) }
  })
  okBtn.addEventListener('click', () => { if (rect && rect.bbox) run(rect.bbox) })
  $('cancel').addEventListener('click', () => window.close())

  async function run(bbox) {
    okBtn.disabled = true
    sizeEl.parentNode.querySelector('.dim').textContent = '…分析中'
    try {
      const shot2 = await apiGet('/api/companion/screen-shot', 'POST', { bbox: bbox }, 30000)
      if (!shot2.ok || !shot2.image_base64) throw new Error('区域截图失败')
      const vision = await apiGet('/api/xiaozhi/vision', 'POST', {
        image_base64: shot2.image_base64,
        question: '详细描述这张截图区域里的内容，包括窗口、文字和界面元素。',
      }, 60000)
      if (!vision.ok) throw new Error(vision.detail || '小智视觉失败')
      const say = await apiGet('/api/xiaozhi/say', 'POST', { text: '你看看我屏幕上的这个区域：' + (vision.text || '') }, 20000)
      if (!say.ok) throw new Error('注入对话失败')
      window.close()
    } catch (err) {
      $('tip').textContent = '⚠ ' + err.message + ' — 按 Esc 关闭'
      okBtn.disabled = false
      sizeEl.parentNode.querySelector('.dim').textContent = 'px'
    }
  }

  ;(async function init() {
    try {
      $('tip').textContent = '正在截取屏幕…'
      const s = await apiGet('/api/companion/screen-shot', 'POST', {})
      if (!s.ok || !s.image_base64) throw new Error(s.error || '截图失败')
      virtW = s.width; virtH = s.height
      const img = new Image()
      img.onload = () => { imgW = img.naturalWidth; imgH = img.naturalHeight; shot.src = img.src; place(); $('tip').textContent = '拖拽框选要分析的屏幕区域 · Enter 确定 · Esc 取消' }
      img.onerror = () => { $('tip').textContent = '⚠ 图像加载失败，按 Esc 关闭' }
      img.src = 'data:image/jpeg;base64,' + s.image_base64
    } catch (err) {
      $('tip').textContent = '⚠ ' + err.message + ' — 按 Esc 关闭'
    }
  })()
})()
</script>
</body>
</html>
