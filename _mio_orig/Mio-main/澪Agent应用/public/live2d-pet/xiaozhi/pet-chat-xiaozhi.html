<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mio 小智对话</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:transparent; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    display:flex; align-items:center; padding:8px;
  }
  .bar {
    flex:1; display:flex; align-items:center; gap:8px;
    background:rgba(28,32,42,0.88);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:16px; padding:7px 8px 7px 14px;
    box-shadow:0 6px 22px rgba(0,0,0,0.28);
    backdrop-filter:blur(10px);
    -webkit-app-region: drag;   /* 空白区域可拖动窗口 */
  }
  .bar input {
    flex:1; min-width:0;
    background:transparent; border:none; outline:none;
    color:#fff; font-size:14px; letter-spacing:0.3px;
    -webkit-app-region: no-drag;
  }
  .bar input::placeholder { color:rgba(255,255,255,0.42); }
  .bar .dot { width:7px; height:7px; border-radius:50%; background:#5ee08a; box-shadow:0 0 6px #5ee08a; flex:none; -webkit-app-region: no-drag; }
  .bar .dot.connecting { background:#f5c26b; box-shadow:0 0 6px #f5c26b; }
  .bar .dot.offline { background:#f0785e; box-shadow:0 0 6px #f0785e; }
  .bar .diag {
    flex:none; font-size:9px; color:rgba(255,255,255,0.42);
    font-family:Consolas,monospace; letter-spacing:0; white-space:nowrap;
    max-width:86px; overflow:hidden; text-overflow:ellipsis;
    -webkit-app-region: no-drag;
  }
  .bar button.send {
    flex:none; border:none; cursor:pointer;
    background:linear-gradient(135deg,#4f6ef7,#7a5cf0);
    color:#fff; font-size:13px; font-weight:600;
    padding:8px 16px; border-radius:12px;
    -webkit-app-region: no-drag;
  }
  .bar button.send:disabled { opacity:0.45; cursor:default; }
  .bar button.mic {
    flex:none; width:32px; height:32px; border-radius:50%;
    border:none; cursor:pointer;
    background:rgba(255,255,255,0.12); color:#fff; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.15s, box-shadow 0.15s;
    -webkit-app-region: no-drag;
  }
  .bar button.mic:hover { background:rgba(255,255,255,0.22); }
  .bar button.mic.recording {
    background:#e0574a; color:#fff;
    animation:micPulse 1.1s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%,100% { box-shadow:0 0 0 0 rgba(224,87,74,0.55); }
    50% { box-shadow:0 0 0 7px rgba(224,87,74,0); }
  }
  .close-btn {
    position:absolute; top:-9px; right:-9px;
    width:20px; height:20px; border-radius:50%;
    border:none; cursor:pointer;
    background:rgba(40,44,56,0.92);
    color:rgba(255,255,255,0.85); font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
    -webkit-app-region: no-drag;
  }
  .close-btn:hover { background:#e0574a; color:#fff; }
</style>
</head>
<body>
  <div class="bar" style="position:relative;">
    <button type="button" class="close-btn" id="closeBtn" title="退出对话">✕</button>
    <span class="dot offline" id="dot"></span>
    <span class="diag" id="diag"></span>
    <input id="input" type="text" placeholder="和小智说点什么…" autocomplete="off" spellcheck="false">
    <button type="button" class="mic" id="mic" title="语音输入">🎤</button>
    <button type="button" class="send" id="send" disabled>发送</button>
  </div>
<script>
(function () {
  'use strict'
  const input = document.getElementById('input')
  const sendBtn = document.getElementById('send')
  const micBtn = document.getElementById('mic')
  const dot = document.getElementById('dot')
  const diag = document.getElementById('diag')
  const bridge = window.mioPetChat || {}
  let ws = null
  let connected = false
  let sessionId = ''
  let reconnectTimer = null
  let pcmFrames = 0
  let audioState = 'none'
  function updateDiag() {
    if (diag) diag.textContent = pcmFrames + 'f·' + (audioState === 'running' ? 'r' : audioState === 'suspended' ? 's' : 'x') + '·' + playQueue.length
  }

  // ---- 音频播放（48kHz 双声道 float32 planar，来自后端代理解码）----
  let audioCtx = null
  let playQueue = []
  let playing = false
  let nextStartTime = 0
  let activeSources = new Set()
  let source = null

  function ensureAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext
      if (AC) { try { audioCtx = new AC() } catch (e) { audioCtx = null } }
    }
    if (audioCtx && audioCtx.state === 'suspended') { try { audioCtx.resume() } catch (e) {} }
    return audioCtx
  }
  function pump() {
    if (!audioCtx || playing || playQueue.length === 0) return
    playing = true
    // 用 WebAudio 时钟精确排程，帧背靠背播放（消除 onended 回调间隙）
    while (playQueue.length > 0) {
      const buf = playQueue.shift()
      const src = audioCtx.createBufferSource()
      src.buffer = buf
      src.connect(audioCtx.destination)
      const now = audioCtx.currentTime
      if (nextStartTime < now + 0.03) nextStartTime = now + 0.03
      src.start(nextStartTime)
      nextStartTime += buf.duration
      src.onended = function () { activeSources.delete(src); try { src.disconnect() } catch (e) {} }
      activeSources.add(src)
    }
    playing = false
  }
  function stopPlayback() {
    for (const s of activeSources) { try { s.onended = null; s.stop() } catch (e) {} }
    activeSources.clear()
    playQueue = []; playing = false; nextStartTime = 0
  }
  function handlePcm(data) {
    const ctx = ensureAudioCtx()
    if (!ctx || data.byteLength < 8) return
    pcmFrames += 1
    audioState = ctx.state
    updateDiag()
    // data 是 ArrayBuffer（ws.binaryType='arraybuffer'），没有 .buffer 属性
    const view = new DataView(data, 0, data.byteLength)
    const samples = view.getUint32(0, true)
    const channels = view.getUint32(4, true)
    if (samples < 1 || channels < 1 || channels > 8) return
    const frameBytes = samples * 4
    if (8 + frameBytes * channels > data.byteLength) return
    const buffer = ctx.createBuffer(channels, samples, 48000)
    for (let c = 0; c < channels; c++) {
      const off = 8 + c * frameBytes
      buffer.copyToChannel(new Float32Array(data, off, samples), c)
    }
    playQueue.push(buffer)
    pump()
  }

  // ---- 气泡转发（输入条 → main → 桌宠气泡）----
  function bubble(payload) { if (bridge.sendXiaozhiBubble) bridge.sendXiaozhiBubble(payload) }

  // ---- WebSocket（本地代理 → 小智官方云）----
  let retryDelay = 3000
  function setStatus(state) { dot.className = 'dot ' + state }
  function connect() {
    setStatus('connecting')
    const url = 'ws://' + location.host + '/api/xiaozhi/ws'
    let wsTry
    try { wsTry = new WebSocket(url) } catch (e) { setStatus('offline'); scheduleReconnect(); return }
    ws = wsTry
    ws.binaryType = 'arraybuffer'
    ws.onopen = function () {}
    ws.onclose = function () { connected = false; setStatus('offline'); scheduleReconnect() }
    ws.onerror = function () {}
    ws.onmessage = function (ev) {
      if (typeof ev.data === 'string') handleText(ev.data)
      else handlePcm(ev.data)
    }
  }
  function scheduleReconnect() {
    window.clearTimeout(reconnectTimer)
    reconnectTimer = window.setTimeout(connect, retryDelay)
    retryDelay = Math.min(15000, Math.round(retryDelay * 1.6))
  }
  function sendPetEvent(ev) {
    try {
      if (window.mioPetChat && window.mioPetChat.sendPetEvent) window.mioPetChat.sendPetEvent(ev)
    } catch (e) {}
  }
  function handleText(raw) {
    let j
    try { j = JSON.parse(raw) } catch (e) { return }
    switch (j.type) {
      case 'hello':
        connected = true; sessionId = j.session_id || ''; setStatus('connected'); sendBtn.disabled = false
        retryDelay = 3000
        bubble({ type: 'stop' })
        break
      case 'llm':
        bubble({ type: 'thinking', emotion: j.emotion || '' })
        if (j.emotion) sendPetEvent({ type: 'emotion', emotion: j.emotion })
        break
      case 'tts':
        if (j.state === 'start') {
          stopPlayback()
          sendPetEvent({ type: 'speaking', speaking: true })
        } else if (j.state === 'sentence_start' && j.text) {
          bubble({ type: 'text', text: j.text })
          sendPetEvent({ type: 'speaking', speaking: true })
        } else if (j.state === 'stop') {
          bubble({ type: 'stop' }); bubble({ type: 'speak_stop' })
          sendPetEvent({ type: 'speaking', speaking: false })
        }
        break
      case 'error':
        // 断连/重连只改指示灯状态，不弹气泡打扰
        if (j.error === 'connecting') setStatus('offline')
        else setStatus('offline')
        break
      default: break
    }
  }

  function sendText() {
    const text = input.value.trim()
    if (!text) return
    if (!connected) { input.value = ''; bubble({ type: 'text', text: '⚠ 连接中，请稍后再试' }); return }
    ensureAudioCtx()
    stopPlayback()
    input.value = ''
    if (ws && ws.readyState === 1) {
      // 官方云限制：空闲会话 detect 长文本会被拒，先短词唤醒；等唤醒回复播完再注入长文本
      // 30s 内已唤醒过则直接注入（免重复唤醒废话）
      const lastWake = Number(localStorage.getItem('xz_last_wake') || 0)
      if (Date.now() - lastWake < 30000) {
        ws.send(JSON.stringify({ session_id: sessionId, type: 'listen', state: 'detect', text: text, source: 'text' }))
        return
      }
      bubble({ type: 'thinking', text: '' })
      ws.send(JSON.stringify({ session_id: sessionId, type: 'listen', state: 'detect', text: '你好', source: 'text' }))
      setTimeout(() => {
        localStorage.setItem('xz_last_wake', String(Date.now()))
        ws.send(JSON.stringify({ session_id: sessionId, type: 'listen', state: 'detect', text: text, source: 'text' }))
      }, 3500)
    }
  }

  // ---- 语音输入（Web Speech API 识别中文 → 自动发送）----
  let recognition = null
  let isRecording = false
  function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition
    if (!SR) { micBtn.style.display = 'none'; return }
    try { recognition = new SR() } catch (e) { micBtn.style.display = 'none'; return }
    recognition.lang = 'zh-CN'
    recognition.interimResults = false
    recognition.continuous = false
    recognition.maxAlternatives = 1
    recognition.onstart = function () { isRecording = true; micBtn.classList.add('recording'); micBtn.title = '正在听，点击停止' }
    recognition.onend = function () { isRecording = false; micBtn.classList.remove('recording'); micBtn.title = '语音输入' }
    recognition.onresult = function (e) {
      let text = ''
      try { text = e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : '' } catch (err) {}
      if (text) { input.value = text; sendText() }
    }
    recognition.onerror = function (e) {
      isRecording = false
      micBtn.classList.remove('recording'); micBtn.title = '语音输入'
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        bubble({ type: 'text', text: '⚠ 麦克风权限被拒绝，请在 Windows 设置中允许应用使用麦克风' })
      } else if (e.error === 'no-speech') {
        bubble({ type: 'text', text: '👂 没听清，再试一次？' })
      } else if (e.error === 'aborted') {
        // 用户手动停止，忽略
      } else {
        bubble({ type: 'text', text: '⚠ 语音识别失败：' + e.error })
      }
    }
  }
  micBtn.addEventListener('click', function () {
    if (!recognition) return
    if (isRecording) {
      try { recognition.stop() } catch (e) {}
      return
    }
    ensureAudioCtx()
    stopPlayback()  // 打断正在播放的语音，避免识别到自己的声音
    try { recognition.start(); isRecording = true; micBtn.classList.add('recording'); micBtn.title = '正在听，点击停止' } catch (e) { bubble({ type: 'text', text: '⚠ 语音识别启动失败' }) }
  })
  initRecognition()

  sendBtn.addEventListener('click', sendText)
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { sendText(); e.preventDefault() }
  })
  document.getElementById('closeBtn').addEventListener('click', function () {
    if (recognition) { try { recognition.abort() } catch (e) {} }
    stopPlayback()
    bubble({ type: 'close' })
    if (bridge.hide) bridge.hide()
  })
  window.__xiaozhiDiag = function () {
    return {
      connected: connected,
      sessionId: sessionId,
      wsState: ws ? ws.readyState : -1,
      pcmFrames: pcmFrames,
      audioState: audioState,
      queueDepth: playQueue.length,
      playing: playing,
      hasMic: !!recognition,
    }
  }
  connect()
})()
</script>
</body>
</html>
